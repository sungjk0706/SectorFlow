<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>SectorFlow</title>
    <link rel="icon" href="/favicon.ico?v=6" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=4">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=4">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5">
    <style>
      /* macOS Safari/WebKit 연락처 자동완성 아이콘 숨김 */
      input::-webkit-contacts-auto-fill-button {
        visibility: hidden;
        display: none !important;
        pointer-events: none;
        position: absolute;
        right: 0;
      }
      input::-webkit-credentials-auto-fill-button {
        visibility: hidden;
        display: none !important;
        pointer-events: none;
        position: absolute;
        right: 0;
      }

      /* ── 검색 입력란 placeholder 색상 통일 (COLOR.disabled #9e9e9e) ── */
      .sf-search-input::placeholder {
        color: #9e9e9e;
      }

      /* ── 스크롤바 너비 8px 통일 (마우스 classic 모드 고정) ──
         COLOR 팔레트와 일관: thumb=borderDark(#e5e5ea), track=transparent.
         ::-webkit-scrollbar 정의 시 macOS 자동/오버레이 동작이 무시되고
         항상 classic으로 고정됨 — 마우스 환경에서 의도된 동작. */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: #e5e5ea; border-radius: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb:hover { background: #d1d1d6; }
    </style>
  </head>
  <body style="margin:0;overflow:hidden">
    <div id="root" style="height:100vh"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
