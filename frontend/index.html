    <link rel="icon" href="/favicon.ico?v=6" sizes="any">

    <style>
      /* macOS Safari/WebKit 연락처 자동완성 아이콘 숨김 */
      input::-webkit-contacts-auto-fill-button {
        visibility: hidden;
        display: none !important;
        pointer-events: none;
        position: absolute;
        right: 0;
      }
      input::-webkit-credentials-auto-fill-button {
        visibility: hidden;
        display: none !important;
        pointer-events: none;
        position: absolute;
        right: 0;
      }

      /* ── 검색 입력란 placeholder 색상 통일 (COLOR.disabled #9e9e9e) ── */
      .sf-search-input::placeholder {
        color: #9e9e9e;
      }
    </style>
